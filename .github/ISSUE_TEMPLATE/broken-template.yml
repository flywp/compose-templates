name: Report a broken template
description: A template does not deploy, or the app does not work after the deploy.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: A security problem? Do not open an issue. Use "Report a vulnerability" on the Security tab.
  - type: input
    id: template
    attributes:
      label: Template
      description: The name of the template.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what went wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The deploy log or the app log. Remove each password and secret first.
      render: shell
