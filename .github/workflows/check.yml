name: Check templates

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base branch, for the version rule of a changed template.
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          tools: composer

      - run: composer install --no-interaction --no-progress

      - name: Check each template
        run: php bin/check.php --docker
        env:
          # The commit that the pull request starts from: a later push to the base branch does not change the rule.
          BASE_REF: ${{ github.event.pull_request.base.sha }}
