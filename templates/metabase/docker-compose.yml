services:
  app:
    image: metabase/metabase:v0.63.19.1
    mem_limit: 1536m
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: "5432"
      MB_DB_USER: metabase
      MB_DB_PASS: ${DB_PASSWORD}
      MB_DB_HOST: db
      MB_SITE_URL: ${SITE_URL}
      MB_ENCRYPTION_SECRET_KEY: ${ENCRYPTION_KEY}
      # Java takes a quarter of the memory limit by default.
      JAVA_OPTS: -XX:MaxRAMPercentage=75
    healthcheck:
      test: ["CMD-SHELL", "curl --fail -I http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16.15-alpine
    mem_limit: 512m
    restart: unless-stopped
    environment:
      POSTGRES_USER: metabase
      POSTGRES_DB: metabase
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db: {}
