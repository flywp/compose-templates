services:
  app:
    image: ghcr.io/plausible/community-edition:v3.2.1
    mem_limit: 768m
    restart: unless-stopped
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    expose:
      - "8000"
    environment:
      BASE_URL: ${SITE_URL}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      TOTP_VAULT_KEY: ${TOTP_VAULT_KEY}
      DATABASE_URL: postgres://plausible:${DB_PASSWORD}@db:5432/plausible_db
      CLICKHOUSE_DATABASE_URL: http://events:8123/plausible_events_db
      TMPDIR: /var/lib/plausible/tmp
    volumes:
      - data:/var/lib/plausible
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      db:
        condition: service_healthy
      events:
        condition: service_healthy

  db:
    image: postgres:16.15-alpine
    mem_limit: 256m
    restart: unless-stopped
    environment:
      POSTGRES_USER: plausible
      POSTGRES_DB: plausible_db
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plausible"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 1m

  # The settings of Plausible for ClickHouse on a small server: fewer logs, a small cache, one thread.
  events-settings:
    image: clickhouse/clickhouse-server:24.12.6.70-alpine
    mem_limit: 64m
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        cat > /config.d/logs.xml <<'EOF'
        <clickhouse>
          <logger><level>warning</level><console>true</console></logger>
          <query_log replace="1">
            <database>system</database>
            <table>query_log</table>
            <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            <engine>ENGINE = MergeTree PARTITION BY event_date ORDER BY (event_time) TTL event_date + interval 30 day SETTINGS ttl_only_drop_parts=1</engine>
          </query_log>
          <metric_log remove="remove" />
          <asynchronous_metric_log remove="remove" />
          <query_thread_log remove="remove" />
          <text_log remove="remove" />
          <trace_log remove="remove" />
          <session_log remove="remove" />
          <part_log remove="remove" />
        </clickhouse>
        EOF
        cat > /config.d/ipv4-only.xml <<'EOF'
        <clickhouse><listen_host>0.0.0.0</listen_host></clickhouse>
        EOF
        cat > /config.d/low-resources.xml <<'EOF'
        <clickhouse><mark_cache_size>524288000</mark_cache_size></clickhouse>
        EOF
        cat > /users.d/default-profile-low-resources-overrides.xml <<'EOF'
        <clickhouse>
          <profiles>
            <default>
              <max_threads>1</max_threads>
              <max_block_size>8192</max_block_size>
              <max_download_threads>1</max_download_threads>
              <input_format_parallel_parsing>0</input_format_parallel_parsing>
              <output_format_parallel_formatting>0</output_format_parallel_formatting>
            </default>
          </profiles>
        </clickhouse>
        EOF
    volumes:
      - events-config:/config.d
      - events-users:/users.d

  events:
    image: clickhouse/clickhouse-server:24.12.6.70-alpine
    mem_limit: 1024m
    restart: unless-stopped
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - events:/var/lib/clickhouse
      - events-logs:/var/log/clickhouse-server
      - events-config:/etc/clickhouse-server/config.d
      - events-users:/etc/clickhouse-server/users.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 1m
    depends_on:
      events-settings:
        condition: service_completed_successfully

volumes:
  data: {}
  db: {}
  events: {}
  events-logs: {}
  events-config: {}
  events-users: {}
